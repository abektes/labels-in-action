apply plugin: 'com.android.application'

android {
    namespace = "nl.abektes.fichero"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "nl.abektes.fichero"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            /*
             * ML Kit ships its recognisers as native libraries, packaged once
             * per ABI without a filter — OCR is ~11MB each, object detection
             * ~10MB each. Unfiltered, the bundled build passed 75MB.
             *
             * arm64-v8a only. x86/x86_64 are emulator-only (Apple Silicon
             * emulators are arm64, so they still work). armeabi-v7a is 32-bit
             * ARM, which Google Play has not accepted since 2019 and which no
             * phone new enough for minSdk 26 and Bluetooth LE realistically
             * runs; carrying it cost 16MB to serve essentially nobody.
             *
             * Add 'armeabi-v7a' back for a genuinely 32-bit device, or
             * 'x86_64' for an Intel emulator.
             */
            abiFilters 'arm64-v8a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // TFLite models are memory-mapped straight out of the APK, so the
            // classifier must be stored uncompressed or it cannot be loaded.
            noCompress 'tflite'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

/*
 * ML Kit sizing. Measured with clean builds (an incremental assemble leaves
 * tens of MB of slack in the archive and will lie to you):
 *
 *   no scan feature at all ............................  7.4 MB
 *   models via Play Services (default) ................ 27.6 MB
 *   models bundled into the APK ....................... 45.4 MB
 *
 * Both include ~1.3 MB of genai-prompt classes for AI object naming and ~14 MB
 * for the live overlay's object detector, which has no unbundled variant and so
 * is in the APK either way.
 * Gemini Nano itself is not in either: it lives in Android's AICore, so there
 * is no bundled/unbundled choice to make for it.
 *
 * Default is Play Services: the model is fetched once on first scan, so the
 * APK stays small. Build with -PficheroBundleMlkitModels=true to embed the
 * recognisers instead — larger, but it scans offline from the first launch and
 * needs no Play Services, which is what you want for a de-Googled phone.
 */
def bundleMlkitModels = (project.findProperty('ficheroBundleMlkitModels') ?: 'false').toBoolean()

configurations.configureEach {
    /*
     * @capacitor-mlkit/text-recognition unconditionally pulls in all five
     * script models. Chinese, Japanese, Korean and Devanagari dominate the
     * download, and this is a label printer for Latin-script stock.
     *
     * The plugin only touches those classes inside individual switch branches
     * of TextRecognition.createRecognizerOptionsForScript, and
     * src/lib/scan/mlkit.ts never passes a `script`, so the Latin default is
     * the only branch taken and the excluded classes are never resolved.
     *
     * If you add a non-Latin script to that call, drop the matching exclude
     * here too or the scan throws NoClassDefFoundError at that branch.
     */
    exclude group: 'com.google.mlkit', module: 'text-recognition-chinese'
    exclude group: 'com.google.mlkit', module: 'text-recognition-devanagari'
    exclude group: 'com.google.mlkit', module: 'text-recognition-japanese'
    exclude group: 'com.google.mlkit', module: 'text-recognition-korean'

    if (!bundleMlkitModels) {
        // The unbundled play-services-mlkit-* artifacts expose the same
        // com.google.mlkit.vision.text.latin classes the plugin imports, so
        // dropping the bundled pair compiles unchanged and removes ~27MB of
        // native engine (libmlkit_google_ocr_pipeline.so, libbarhopper_v3.so).
        exclude group: 'com.google.mlkit', module: 'text-recognition'
        exclude group: 'com.google.mlkit', module: 'barcode-scanning'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    /*
     * Live label overlay (nl.abektes.fichero.livelabels). CameraX is already on
     * the classpath via the barcode plugin, but that is `implementation` inside
     * another module and therefore invisible here, so it is declared again.
     * Versions track the barcode plugin's defaults to avoid two CameraX copies.
     */
    implementation "androidx.camera:camera-core:1.5.2"
    implementation "androidx.camera:camera-camera2:1.5.2"
    implementation "androidx.camera:camera-lifecycle:1.5.2"
    implementation "androidx.camera:camera-view:1.5.2"
    /*
     * CameraX hands back a ListenableFuture but does not re-export the type, and
     * com.google.guava:listenablefuture resolves to the deliberately-empty
     * 9999.0 marker artifact, so the interface is absent at compile time.
     *
     * compileOnly, not implementation: the real classes already ship in the APK
     * via the barcode plugin's own dependencies (verified against the built dex),
     * so this needs to satisfy javac and nothing more. Adding full Guava for
     * real would put ~2.7MB in the APK to redeclare a class already in it.
     */
    // Version matches the runtime graph; consistent resolution rejects any other.
    compileOnly "com.google.guava:guava:31.0.1-jre"
    implementation "com.google.mlkit:object-detection:17.0.2"
    // Lets the live overlay swap ML Kit's five coarse categories for the
    // bundled ImageNet classifier — the difference between "Object" and
    // "water bottle" on every box.
    implementation "com.google.mlkit:object-detection-custom:17.0.2"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
